services:
  frontend:
    build:
      context: ./landingpage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend/booking
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BLOG_DB_NAME: ${BLOG_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/000_init_databases.sh:/docker-entrypoint-initdb.d/000_init_databases.sh:ro
      - ./backend/database/001_bookings.sql:/docker-entrypoint-initdb.d/001_bookings.sql:ro
      - ./backend/database/002_blogs_frontend.sql:/docker-entrypoint-initdb.d/002_blogs_frontend.sql:ro
      - ./backend/database/mock_data.sql:/docker-entrypoint-initdb.d/mock_data.sql:ro
      - ./backend/database/mock_blogs.sql:/docker-entrypoint-initdb.d/mock_blogs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
