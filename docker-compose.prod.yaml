services:
  frontend:
    build:
      context: ./landingpage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend/booking
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/001_bookings.sql:/docker-entrypoint-initdb.d/001_bookings.sql:ro
      - ./backend/database/mock_data.sql:/docker-entrypoint-initdb.d/mock_data.sql:ro   # mock data, please remove in real prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
