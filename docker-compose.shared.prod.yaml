# Shared infrastructure stack.
# This file boots the single Postgres container used by both booking and blog.
# Start this stack first so the shared Docker network and database exist before
# bringing up either backend-specific stack.
services:
  db:
    image: postgres:17
    container_name: clinic-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.env.shared
    networks:
      clinic-backend:
        aliases:
          - db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only booking SQL lives in the auto-run init directory for POSTGRES_DB.
      - ./backend/database/000_init_databases.sh:/docker-entrypoint-initdb.d/000_init_databases.sh:ro
      - ./backend/database/001_bookings.sql:/docker-entrypoint-initdb.d/001_bookings.sql:ro
      - ./backend/database/mock_data.sql:/docker-entrypoint-initdb.d/mock_data.sql:ro
      # Blog SQL is mounted outside the auto-run directory so the bootstrap
      # script can apply it only to the blogs database.
      - ./backend/database/002_blogs_frontend.sql:/blog-init/002_blogs_frontend.sql:ro
      - ./backend/database/mock_blogs.sql:/blog-init/mock_blogs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  clinic-backend:
    name: clinic-backend
